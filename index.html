<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gully</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f4; --fg:#15221b; --mut:#5c6b61; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1512; --fg:#eaf2ec; --mut:#9fb0a4; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--fg); font:16px/1.6 -apple-system, system-ui, sans-serif; padding:16px; }
  main { max-width:32rem; }
  h1 { font-size:1.6rem; margin:0 0 .4rem; letter-spacing:-.02em; }
  p { color:var(--mut); margin:.4rem 0 1.2rem; }
  a { color:inherit; }
</style>
<main>
  <h1>Gully</h1>
  <p>Street games from Karachi, made into small mobile games.</p>
  <p><a href="/khokho/">Kho-Kho</a> — chase, tag, pass the kho.</p>
</main>
